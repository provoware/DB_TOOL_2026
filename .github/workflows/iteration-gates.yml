name: Iteration Gate Router

on:
  pull_request:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.route.outputs.profile }}
      run_targeted: ${{ steps.route.outputs.run_targeted }}
      run_governance: ${{ steps.route.outputs.run_governance }}
      run_foundation: ${{ steps.route.outputs.run_foundation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run single-source iteration preflight
        id: route
        shell: bash
        run: |
          python scripts/iteration_preflight.py --github-output "$GITHUB_OUTPUT" --json

      - name: Validate changed-file scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          manifest="$(find .provoware/iterations -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
          test -n "$manifest"
          python scripts/check_iteration_scope.py "$manifest" --base "$BASE_SHA"

  targeted:
    needs: route
    if: needs.route.outputs.run_targeted == 'true'
    uses: ./.github/workflows/targeted-iteration.yml

  governance:
    needs: route
    if: needs.route.outputs.run_governance == 'true'
    uses: ./.github/workflows/agent-governance.yml

  foundation:
    needs: route
    if: needs.route.outputs.run_foundation == 'true'
    uses: ./.github/workflows/repository-foundation.yml
