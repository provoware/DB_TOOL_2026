name: Iteration 20 Chromium Gate

on:
  push:
    branches:
      - iteration-20-browser-search-gate
    paths:
      - ".github/workflows/iteration-20-chromium-gate.yml"
      - ".provoware/iterations/0020-browser-search-gate.json"
      - "src/provoware_db/web/**"
      - "tests/fixtures/**"
  pull_request:
    paths:
      - ".github/workflows/iteration-20-chromium-gate.yml"
      - ".provoware/iterations/0020-browser-search-gate.json"
      - "src/provoware_db/web/**"
      - "tests/fixtures/**"

permissions:
  contents: read

jobs:
  chromium-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "BROWSER=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version

      - name: Install CI-only browser driver library
        run: python -m pip install --disable-pip-version-check "selenium>=4.20,<5"

      - name: Build deterministic CP-03 test database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          PYTHONPATH=src python - <<'PY'
          import runpy
          from pathlib import Path

          ns = runpy.run_path("tests/web/test_cp03_positive_smoke.py")
          create = ns["_create_cp03_db"]
          target = Path("runtime/main.db")
          create(target)
          print(f"TEST_DB={target.resolve()}")
          PY

      - name: Start read-only server
        shell: bash
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python scripts/start_readonly_web.py             --main-db runtime/main.db             --port 8765 > runtime/server.log 2>&1 &
          echo $! > runtime/server.pid
          for i in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then
              echo "SERVER_READY=1"
              exit 0
            fi
            sleep 0.1
          done
          cat runtime/server.log
          exit 1

      - name: Run real Chromium interaction gate
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import shutil
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.common.exceptions import StaleElementReferenceException

          out = Path("runtime")
          out.mkdir(exist_ok=True)
          base = "http://127.0.0.1:8765/"

          options = webdriver.ChromeOptions()
          options.binary_location = os.environ["BROWSER"]
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1440,900")
          options.set_capability("goog:loggingPrefs", {"browser": "ALL"})

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 5, ignored_exceptions=(StaleElementReferenceException,))
          checks: dict[str, object] = {}

          def body() -> str:
              return driver.find_element(By.TAG_NAME, "body").text

          try:
              driver.set_window_size(1440, 900)
              driver.get(base)
              wait.until(lambda d: "Werkzeug" in body())
              checks["startup"] = True
              checks["readonly_visible"] = "NUR LESEN" in body()

              disabled_labels = {"Neu": False, "Bearbeiten": False, "Undo": False, "Papierkorb": False}
              for button in driver.find_elements(By.TAG_NAME, "button"):
                  label = button.text.strip().replace("+ ", "")
                  if label in disabled_labels:
                      disabled_labels[label] = not button.is_enabled()
              checks["mutating_controls_disabled"] = all(disabled_labels.values())
              checks["mutating_control_states"] = disabled_labels

              driver.find_element(By.CSS_SELECTOR, 'button.data-row[data-id="cat-tool"]').click()
              wait.until(lambda d: "Akkuschrauber" in body())
              checks["category_to_entry"] = True

              driver.find_element(By.CSS_SELECTOR, 'button.data-row[data-id="ent-drill"]').click()
              wait.until(lambda d: all(x in body() for x in ("Hersteller", "Zustand", "Kaufdatum")))
              checks["entry_to_fields"] = True
              checks["fields"] = ["Hersteller", "Zustand", "Kaufdatum"]
              driver.save_screenshot(str(out / "main-1440x900-preview.png"))

              for query, expected, key in (
                  ("werk", "Kategorie · Werkzeug", "search_category"),
                  ("akku", "Eintrag · Akkuschrauber", "search_entry"),
                  ("hersteller", "Feld · Hersteller", "search_field"),
              ):
                  driver.get(base)
                  search = driver.find_element(By.ID, "search-query")
                  search.clear()
                  search.send_keys(query)
                  search.send_keys(Keys.ENTER)
                  wait.until(lambda d, expected=expected: expected in body())
                  checks[key] = True

              driver.get(base)
              search = driver.find_element(By.ID, "search-query")
              search.send_keys("nichtvorhanden")
              search.send_keys(Keys.ENTER)
              wait.until(lambda d: "Keine Treffer für „nichtvorhanden“." in body())
              checks["empty_search_state"] = True

              driver.get(base)
              driver.find_element(By.TAG_NAME, "body").click()
              focus_trace = []
              for _ in range(12):
                  driver.switch_to.active_element.send_keys(Keys.TAB)
                  active = driver.switch_to.active_element
                  focus_trace.append({
                      "tag": active.tag_name,
                      "id": active.get_attribute("id") or "",
                      "text": active.text.strip()[:80],
                      "type": active.get_attribute("type") or "",
                  })
              checks["keyboard_focus_trace"] = focus_trace
              checks["keyboard_search_reached"] = any(x["id"] == "search-query" for x in focus_trace)
              checks["keyboard_button_reached"] = any(x["tag"] == "button" for x in focus_trace)

              driver.get(base)
              search = driver.find_element(By.ID, "search-query")
              search.click()
              search.send_keys("akku")
              search.send_keys(Keys.ENTER)
              wait.until(lambda d: "Eintrag · Akkuschrauber" in body())
              checks["keyboard_enter_search"] = True

              severe = [
                  entry for entry in driver.get_log("browser")
                  if entry.get("level") == "SEVERE"
              ]
              checks["browser_console_severe"] = severe

              required = (
                  "startup",
                  "readonly_visible",
                  "mutating_controls_disabled",
                  "category_to_entry",
                  "entry_to_fields",
                  "search_category",
                  "search_entry",
                  "search_field",
                  "empty_search_state",
                  "keyboard_search_reached",
                  "keyboard_button_reached",
                  "keyboard_enter_search",
              )
              failed = [name for name in required if checks.get(name) is not True]
              if severe:
                  failed.append("browser_console_severe")

              evidence = {
                  "iteration": 20,
                  "gate": "real Chromium 1440x900",
                  "browser": driver.capabilities.get("browserVersion"),
                  "platform": driver.capabilities.get("platformName"),
                  "url": base,
                  "checks": checks,
                  "status": "GREEN" if not failed else "RED",
                  "failed": failed,
              }
              (out / "iteration-20-evidence.json").write_text(
                  json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(evidence, ensure_ascii=False, indent=2))
              if failed:
                  raise SystemExit("Iteration 20 Chromium gate failed: " + ", ".join(failed))
          finally:
              driver.quit()
          PY

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if test -f runtime/server.pid; then
            kill "$(cat runtime/server.pid)" 2>/dev/null || true
          fi
          cat runtime/server.log 2>/dev/null || true

      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration-20-chromium-evidence
          path: |
            runtime/iteration-20-evidence.json
            runtime/main-1440x900-preview.png
            runtime/server.log
          if-no-files-found: warn
