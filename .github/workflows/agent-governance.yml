name: Agent Governance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic governance gate
        run: python scripts/validate_agent_governance.py

      - name: Upload TXT governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-governance-report
          path: AGENT_GOVERNANCE_AUSWERTUNG.txt
          if-no-files-found: error
