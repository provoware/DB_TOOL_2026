version: 4

rules:
  planning_before_changes: true
  smallest_meaningful_patch: true
  code_sparing: true
  traffic_sparing: true
  one_writer_per_file: true
  reviewers_never_modify_product_code: true
  planner_never_modify_product_code: true
  orchestrator_never_modify_product_code: true
  gate_agent_never_modify_product_code: true
  require_change_manifest: true
  require_relevant_tests: true
  no_full_test_without_reason: true
  no_repeat_test_without_new_change_or_finding: true
  full_repo_scan_by_exception_only: true
  frozen_core_requires_explicit_plan: true
  screenshot_every_n_iterations: 5
  screenshot_short_summary_required: true
  final_progress_percent_required: true
  final_visual_status_required: true
  exactly_three_next_steps_required: true
  layman_guide_delta_every_iteration: true
  layman_guide_agent_never_modify_product_code: true
  layman_guide_updates_must_be_incremental: true
  queue_items_must_end_in_done_or_blocked: true
  unplanned_file_changes_are_gate_findings: true
  dependency_upgrades_require_explicit_plan: true
  global_formatting_requires_explicit_plan: true
  two_step_iteration_required: true
  step_two_requires_step_one_green: true
  single_branch_pr_for_two_steps: true
  freeze_after_both_steps_only: true
  second_step_must_share_scope: true

review_scope:
  include:
    - changed_files
    - direct_dependencies
    - affected_tests
    - relevant_freeze_manifests
  exclude_by_default:
    - unrelated_modules
    - generated_files
    - build_artifacts

test_policy:
  mode: risk_based
  default:
    - compile_changed_files
    - directly_affected_tests
    - nearest_regression
  full_suite_only_when:
    - architecture_boundary_changed
    - frozen_core_changed
    - dependency_graph_unclear
    - schema_or_migration_changed
    - explicit_deep_gate

iteration_budget:
  S: "1-2 changed files"
  M: "3-5 changed files"
  L: "6-10 changed files"
  XL: ">10 changed files; split required by default"

finding_policy:
  BLOCKER: "immediate stop"
  HIGH: "new patch iteration"
  MEDIUM: "plan for later"
  LOW: "backlog"
  INFO: "document only"
